  <path d="M32 10L32 17" stroke="#FFAA47" stroke-width="3" stroke-linecap="round"/>
  <path d="M19 14L23 20" stroke="#FFAA47" stroke-width="3" stroke-linecap="round"/>
  <path d="M45 14L41 20" stroke="#FFAA47" stroke-width="3" stroke-linecap="round"/>
